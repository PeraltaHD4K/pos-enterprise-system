name: Deploy via AWS SSM (Zero Trust)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Execute Deploy Command via SSM
      run: |
        echo "Iniciando despliegue en la instancia ${{ secrets.EC2_INSTANCE_ID }}..."
        
        # 1. Enviamos el comando y guardamos el ID
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
          --comment "Despliegue automático GitHub Actions" \
          --parameters 'commands=["runuser -l ubuntu -c \"cd /home/ubuntu/pos-enterprise-system && git pull origin main && docker compose up -d --build && docker image prune -f\""]' \
          --output text \
          --query "Command.CommandId")

        echo "Comando enviado. ID: $COMMAND_ID"
        echo "⏳ Esperando finalización del despliegue (Docker Build puede tardar unos minutos)..."

        # 2. Bucle de espera personalizado (Polling)
        # Reemplaza al 'aws ssm wait' que fallaba.
        # Esperamos hasta 15 minutos (90 intentos * 10 segundos)
        for i in {1..90}; do
          # Consultamos el estado actual
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Intento $i: Estado -> $STATUS"
          
          # Si terminó con éxito
          if [ "$STATUS" == "Success" ]; then
            echo "✅ Despliegue completado con éxito."
            echo "--- LOGS DE SALIDA ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardOutputContent" \
              --output text
            exit 0
          
          # Si falló o se canceló
          elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
            echo "❌ El despliegue falló."
            echo "--- LOGS DE ERROR ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
          # Esperamos 10 segundos antes de volver a preguntar
          sleep 10
        done

        echo "⏰ Tiempo de espera agotado en GitHub (Timeout)."
        exit 1