services:
    # Servicio 1: Base de Datos
    db:
        image: postgres:15-alpine
        container_name: pos-db-docker
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: admin # Contraseña interna de la BD
            POSTGRES_DB: db_pos
        ports:
            - "5433:5432" # Puerto externo 5433 para que no choque con tu Postgres local
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - pos-network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # Servicio 2: Backend
    app:
        container_name: pos-backend-app
        build: ./backend
        ports:
            - "8080:8080"
        environment:
            # Conexión DB (Usa el nombre del servicio 'db')
            - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/db_pos
            - SPRING_DATASOURCE_USERNAME=postgres
            - SPRING_DATASOURCE_PASSWORD=admin
            - SPRING_JPA_HIBERNATE_DDL_AUTO=update

            # 🔐 SEGURIDAD (Variables que inyectamos al código)
            # Clave JWT (Cámbiala en producción)
            - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
            - JWT_EXPIRATION=86400000

            # CORS
            - APP_CORS_ALLOWED_ORIGINS=http://localhost:4200

            # Admin Inicial (DataSeeder)
            - ADMIN_USERNAME=superadmin
            - ADMIN_PASSWORD=Prueba123

        depends_on:
            db:
                condition: service_healthy
        networks:
            - pos-network

volumes:
    postgres_data:


networks:
    pos-network:
