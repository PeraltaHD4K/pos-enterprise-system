# "optional:" hace que no falle si el archivo no existe (ej. en producción en la nube)
spring.config.import=optional:file:.env[.properties]

spring.application.name=POS System
# --- CONEXIÓN A BASE DE DATOS ---
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# SEGURIDAD - DATA SEEDER
app.security.admin-password=${ADMIN_PASSWORD}
app.security.admin-username=${ADMIN_USERNAME}

# --- SEGURIDAD JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --- CONFIGURACIÓN CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- COMPORTAMIENTO JPA ---
# "update": Si agregas un campo en Java, actualizará la tabla automáticamente.
# Es lo mejor para desarrollo rápido sin borrar tus datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- RUTA BASE DE LA API ---
server.servlet.context-path=/api/v1