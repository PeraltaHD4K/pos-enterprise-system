<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Productos</h1>
            <button routerLink="/inventory/products/create"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                + Nuevo Producto
            </button>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoría</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Stock</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr *ngIf="isLoading">
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex flex-col items-center justify-center">
                                <span class="text-lg font-medium">Cargando productos...</span>
                                <span class="text-sm">Por favor espere</span>
                            </div>
                        </td>
                    </tr>
                    <ng-container *ngIf="!isLoading">
                        <tr *ngFor="let p of productos">
                            <td class="px-6 py-4">
                                <div class="text-sm font-medium text-gray-900">{{ p.nombre }}</div>
                                <div class="text-sm text-gray-500">SKU: {{ p.sku }}</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                <span
                                    class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                    {{ p.categoria?.nombre || 'Sin Categoría' }}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-900">
                                {{ p.precioVenta | currency:'USD' }}
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-sm text-gray-900">{{ p.stockActual }}</div>
                                <div *ngIf="p.stockActual <= p.stockMinimo" class="text-xs text-red-600 font-bold">
                                    ¡Stock Bajo!
                                </div>
                            </td>
                            <td class="px-6 py-4 text-right text-sm font-medium space-x-2">
                                <a [routerLink]="['/inventory/products/stock', p.id]"
                                    class="text-green-600 hover:text-green-900 cursor-pointer font-bold"
                                    title="Ajustar Stock">
                                    Stock
                                </a>
                                <a [routerLink]="['/inventory/products/edit', p.id]"
                                    class="text-indigo-600 hover:text-indigo-900 cursor-pointer">Editar</a>
                                <button (click)="borrar(p.id)" class="text-red-600 hover:text-red-900">Borrar</button>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="!isLoading && productos.length === 0">
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500">No hay productos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
