<div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl w-full space-y-8 bg-white p-8 rounded-lg shadow-md">

        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                {{ isEditMode ? 'Editar Producto' : 'Registrar Nuevo Producto' }}
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Complete la información técnica y financiera del ítem.
            </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div class="space-y-4">
                    <h3 class="text-lg font-medium text-gray-900 border-b pb-2">Datos Generales</h3>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre del Producto *</label>
                        <input type="text" formControlName="nombre"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">SKU (Código Interno) *</label>
                            <input type="text" formControlName="sku"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Código de Barras *</label>
                            <input type="text" formControlName="codigoBarras"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Categoría *</label>
                        <select formControlName="categoriaId"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white">
                            <option value="" disabled>Seleccione una categoría</option>
                            <option *ngFor="let cat of categorias$ | async" [value]="cat.id">
                                {{ cat.nombre }}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Descripción</label>
                        <textarea rows="3" formControlName="descripcion"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-lg font-medium text-gray-900 border-b pb-2">Datos Financieros e Inventario</h3>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Precio Venta ($) *</label>
                            <input type="number" formControlName="precioVenta"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Costo Promedio ($) *</label>
                            <input type="number" formControlName="costoPromedio"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            <p class="text-xs text-gray-500 mt-1">Se actualizará con las compras.</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Stock Mínimo (Alerta) *</label>
                        <input type="number" formControlName="stockMinimo"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

            </div>

            <div class="flex justify-end gap-4 pt-6 border-t border-gray-200">
                <button routerLink="/inventory/products" type="button"
                    class="py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                    Cancelar
                </button>

                <button type="submit" [disabled]="form.invalid"
                    class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:bg-gray-400">
                    {{ isEditMode ? 'Actualizar Producto' : 'Guardar Producto' }}
                </button>
            </div>

        </form>
    </div>
</div>
