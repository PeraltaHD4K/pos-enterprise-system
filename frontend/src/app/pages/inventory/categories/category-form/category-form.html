<div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">

        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                {{ isEditMode ? 'Editar Categoría' : 'Nueva Categoría' }}
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                {{ isEditMode ? 'Modifica los datos existentes' : 'Registra una nueva clasificación para tus productos'
                }}
            </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre *</label>
                <input id="nombre" type="text" formControlName="nombre"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="Ej. Lacteos, Bebidas...">

                <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched"
                    class="text-red-500 text-xs mt-1">
                    El nombre es obligatorio (mínimo 3 letras).
                </div>
            </div>

            <div>
                <label for="descripcion" class="block text-sm font-medium text-gray-700">Descripción</label>
                <textarea id="descripcion" rows="3" formControlName="descripcion"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="Detalles opcionales..."></textarea>
            </div>

            <div class="flex items-center justify-between gap-4 pt-4">
                <button routerLink="/inventory/categories" type="button"
                    class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Cancelar
                </button>

                <button type="submit" [disabled]="form.invalid"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-gray-400">
                    {{ isEditMode ? 'Actualizar' : 'Guardar' }}
                </button>
            </div>

        </form>
    </div>
</div>
