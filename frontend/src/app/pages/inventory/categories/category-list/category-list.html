<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Categorías</h1>
            <button routerLink="/inventory/categories/create"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                + Nueva Categoría
            </button>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descripción</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr *ngIf="isLoading">
                        <td colspan="5" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex flex-col items-center justify-center">
                                <span class="text-lg font-medium">Cargando productos...</span>
                                <span class="text-sm">Por favor espere</span>
                            </div>
                        </td>
                    </tr>
                    <ng-container *ngIf="!isLoading">
                        <tr *ngFor="let cat of categorias">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ cat.nombre }}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">{{ cat.descripcion }}</td>
                            <td class="px-6 py-4 text-right text-sm font-medium space-x-2">
                                <a [routerLink]="['/inventory/categories/edit', cat.id]"
                                    class="text-indigo-600 hover:text-indigo-900 cursor-pointer">Editar</a>

                                <button (click)="borrar(cat.id)" class="text-red-600 hover:text-red-900">Borrar</button>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="!isLoading && categorias.length === 0">
                        <td colspan="3" class="px-6 py-4 text-center text-gray-500">No hay categorías registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
