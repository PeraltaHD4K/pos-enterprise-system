<div class="min-h-screen bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Configuración del Negocio</h2>

            <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">

                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre de la Tienda</label>
                    <input type="text" formControlName="NOMBRE_TIENDA"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm p-2 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">RFC / RUT / NIT</label>
                    <input type="text" formControlName="RFC"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm p-2 border">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Dirección (Aparece en ticket)</label>
                    <textarea formControlName="DIRECCION" rows="2"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm p-2 border"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Mensaje Pie de Ticket</label>
                    <input type="text" formControlName="TICKET_FOOTER"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm p-2 border">
                    <p class="text-xs text-gray-500 mt-1">Ej: ¡Gracias por su compra! Visítenos pronto.</p>
                </div>

                <div class="pt-4">
                    <button type="submit" [disabled]="isLoading"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50">
                        {{ isLoading ? 'Guardando...' : 'Guardar Cambios' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
