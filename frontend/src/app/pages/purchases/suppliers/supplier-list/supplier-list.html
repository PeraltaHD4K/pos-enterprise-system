<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Proveedores</h1>
            <button routerLink="/purchases/suppliers/create"
                class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                + Nuevo Proveedor
            </button>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Empresa</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Contacto</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Día Visita</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">

                    <tr *ngIf="isLoading">
                        <td colspan="4" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex justify-center items-center gap-2">
                                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600"></div>
                                Cargando proveedores...
                            </div>
                        </td>
                    </tr>

                    <ng-container *ngIf="!isLoading">
                        <tr *ngFor="let prov of proveedores">
                            <td class="px-6 py-4">
                                <div class="text-sm font-medium text-gray-900">{{ prov.empresa }}</div>
                                <div class="text-sm text-gray-500">{{ prov.email || 'Sin correo' }}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-sm text-gray-900">{{ prov.contacto || 'N/A' }}</div>
                                <div class="text-sm text-gray-500">{{ prov.telefono }}</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                <span
                                    class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-semibold">
                                    {{ prov.diaVisita || 'Variable' }}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right text-sm font-medium space-x-2">
                                <a [routerLink]="['/purchases/suppliers/edit', prov.id]"
                                    class="text-indigo-600 hover:text-indigo-900 cursor-pointer">Editar</a>
                                <button (click)="borrar(prov.id)"
                                    class="text-red-600 hover:text-red-900">Borrar</button>
                            </td>
                        </tr>
                    </ng-container>

                    <tr *ngIf="!isLoading && proveedores.length === 0">
                        <td colspan="4" class="px-6 py-10 text-center text-gray-500">No hay proveedores registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
