<div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md">

        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Registrar Nuevo Usuario
            </h2>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                <input id="nombre" type="text" formControlName="nombreCompleto"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                    placeholder="Ej. Juan Pérez">
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
                <input id="username" type="text" formControlName="username"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input id="password" type="password" formControlName="password"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="rol" class="block text-sm font-medium text-gray-700">Rol Asignado</label>
                <select id="rol" formControlName="rolId"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-white">
                    <option value="" disabled>Seleccione un rol</option>
                    <option *ngFor="let rol of roles$ | async" [value]="rol.id">
                        {{ rol.nombre }}
                    </option>
                </select>
            </div>

            <div class="flex items-center justify-between gap-4 pt-4">
                <button routerLink="/users" type="button"
                    class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Cancelar
                </button>

                <button type="submit" [disabled]="form.invalid"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400">
                    Guardar Usuario
                </button>
            </div>

        </form>
    </div>
</div>
