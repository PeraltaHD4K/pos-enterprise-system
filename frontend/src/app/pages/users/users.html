<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">

        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Gestión de Usuarios</h1>
            <button routerLink="/users/create"
                class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 shadow-sm transition-colors">
                + Nuevo Usuario
            </button>
        </div>

        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Usuario</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Nombre</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol
                        </th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Estado</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">

                    <tr *ngIf="isLoading">
                        <td colspan="6" class="px-6 py-10 text-center text-gray-500">
                            <div class="flex justify-center items-center gap-2">
                                <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                                Cargando usuarios...
                            </div>
                        </td>
                    </tr>

                    <tr *ngFor="let u of usuarios">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ u.id }}</td>

                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">
                            {{ u.username }}
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
                            {{ u.nombreCompleto }}
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <span
                                class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-50 text-blue-700 border border-blue-100">
                                {{ u.rol?.nombre || 'Sin Rol'}}
                            </span>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <span
                                class="px-2 py-1 inline-flex text-xs leading-5 font-bold rounded-full cursor-default transition-colors"
                                [ngClass]="u.activo ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'">
                                {{ u.activo ? 'ACTIVO' : 'INACTIVO' }}
                            </span>
                        </td>

                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
                            <button [routerLink]="['/users/edit', u.id]"
                                class="text-indigo-600 hover:text-indigo-900 font-bold hover:underline">
                                Editar
                            </button>

                            <button (click)="alternarEstado(u)" class="font-bold transition-colors"
                                [ngClass]="u.activo ? 'text-red-500 hover:text-red-700' : 'text-green-600 hover:text-green-800'">
                                {{ u.activo ? 'Desactivar' : 'Reactivar' }}
                            </button>
                        </td>
                    </tr>

                    <tr *ngIf="!isLoading && usuarios.length === 0">
                        <td colspan="6" class="px-6 py-10 text-center text-gray-400 italic">
                            No se encontraron usuarios registrados.
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>
