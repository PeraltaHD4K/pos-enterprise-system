<div class="min-h-screen bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">

        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Gestión de Usuarios</h1>
            <button routerLink="/users/create" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                + Nuevo Usuario
            </button>
        </div>

        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Usuario</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rol
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">

                    <ng-container *ngIf="usuarios$ | async as listaUsuarios; else loadingTemplate">
                        <tr *ngFor="let u of listaUsuarios">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ u.id }}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ u.username }}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span
                                    class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                    {{ u.rol?.nombre || 'Sin Rol'}}
                                </span>
                            </td>
                        </tr>

                        <tr *ngIf="listaUsuarios.length === 0">
                            <td colspan="3" class="px-6 py-4 text-center text-gray-500">No hay usuarios registrados</td>
                        </tr>
                    </ng-container>

                    <ng-template #loadingTemplate>
                        <tr>
                            <td colspan="3" class="px-6 py-4 text-center text-gray-500">
                                Cargando usuarios...
                            </td>
                        </tr>
                    </ng-template>

                </tbody>
            </table>
        </div>

    </div>
</div>
