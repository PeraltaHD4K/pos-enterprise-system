<header
    class="bg-white shadow-sm z-20 px-4 py-2 flex justify-between items-center h-16 shrink-0 border-b border-gray-200">
    <div class="flex items-center gap-4">
        <button (click)="onLogout.emit()"
            class="group flex items-center gap-2 text-gray-500 hover:text-red-600 transition-colors px-3 py-2 rounded-lg hover:bg-red-50"
            title="Cerrar Sesión">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:scale-110 transition-transform"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="font-bold text-sm text-gray-700 group-hover:text-red-700">
                {{ sesionActual?.usuario?.username || username }}
            </span>
        </button>

        <div *ngIf="sesionActual"
            class="hidden sm:flex bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold border border-green-200 items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span>CAJA ABIERTA</span>
        </div>

        <div *ngIf="sesionActual" class="text-xs text-gray-500 hidden sm:block">
            {{ sesionActual?.fechaApertura | date:'shortTime' }}
        </div>
    </div>

    <div class="flex items-center gap-4">
        <h1 class="text-lg font-black text-gray-300 tracking-wider hidden md:block">POS SYSTEM</h1>

        <button *ngIf="sesionActual" (click)="onOpenHistory.emit()"
            class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white border border-blue-200 px-4 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-2 shadow-sm">
            <span>📜</span> <span class="hidden sm:inline">Ventas Hoy</span>
        </button>

        <button *ngIf="sesionActual" (click)="onCloseShift.emit()"
            class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 px-4 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-2 shadow-sm">
            <span>🔒</span> <span class="hidden sm:inline">Cerrar Turno</span>
        </button>
    </div>
</header>
