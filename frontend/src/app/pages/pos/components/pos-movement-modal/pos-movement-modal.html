<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen px-4 text-center">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" (click)="onClose.emit()"></div>

        <div
            class="inline-block bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all align-middle sm:max-w-md w-full">

            <div class="bg-indigo-600 px-4 py-3 flex justify-between items-center text-white">
                <h3 class="text-lg font-bold">💸 Movimiento de Caja</h3>
                <button (click)="onClose.emit()" class="text-indigo-200 hover:text-white">&times;</button>
            </div>

            <div class="p-6 bg-white space-y-4">

                <div class="flex rounded-md shadow-sm" role="group">
                    <button type="button" (click)="tipo = 'INGRESO'"
                        class="px-4 py-2 text-sm font-medium border rounded-l-lg flex-1 transition-colors"
                        [ngClass]="tipo === 'INGRESO' ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'">
                        ⬇️ Entrada
                    </button>
                    <button type="button" (click)="tipo = 'RETIRO'"
                        class="px-4 py-2 text-sm font-medium border rounded-r-lg flex-1 transition-colors"
                        [ngClass]="tipo === 'RETIRO' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'">
                        ⬆️ Salida / Gasto
                    </button>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">Monto ($)</label>
                    <input type="number" [(ngModel)]="monto"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-xl font-bold p-2 border"
                        placeholder="0.00">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700">Motivo</label>
                    <textarea [(ngModel)]="motivo" rows="2"
                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
                        placeholder="Ej: Pago de agua, cambio inicial..."></textarea>
                </div>

            </div>

            <div class="bg-gray-50 px-4 py-3 flex flex-row-reverse gap-2">
                <button (click)="confirmar()" [disabled]="isProcessing"
                    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white sm:w-auto disabled:bg-gray-400 transition-colors"
                    [ngClass]="tipo === 'INGRESO' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'">
                    {{ isProcessing ? 'Guardando...' : (tipo === 'INGRESO' ? 'Registrar Ingreso' : 'Registrar Retiro')
                    }}
                </button>
                <button (click)="onClose.emit()"
                    class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>
