<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75" (click)="onClose.emit()"></div>

        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">

            <div class="bg-indigo-900 px-4 py-4 sm:px-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    💸 Cobrar Venta
                </h3>
            </div>

            <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                <div class="text-center mb-6">
                    <p class="text-gray-500 text-sm uppercase tracking-wider font-bold">Total a Pagar</p>
                    <p class="text-5xl font-black text-indigo-900">{{ total | currency:'USD' }}</p>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-6 p-1 bg-gray-100 rounded-lg">
                    <button (click)="seleccionarMetodo('EFECTIVO')"
                        class="py-2 text-sm font-bold rounded-md transition-all"
                        [ngClass]="{'bg-white shadow text-indigo-600': metodoSeleccionado === 'EFECTIVO', 'text-gray-500 hover:bg-gray-200': metodoSeleccionado !== 'EFECTIVO'}">
                        💵 Efectivo
                    </button>
                    <button (click)="seleccionarMetodo('TARJETA')"
                        class="py-2 text-sm font-bold rounded-md transition-all"
                        [ngClass]="{'bg-white shadow text-indigo-600': metodoSeleccionado === 'TARJETA', 'text-gray-500 hover:bg-gray-200': metodoSeleccionado !== 'TARJETA'}">
                        💳 Tarjeta
                    </button>
                    <button (click)="seleccionarMetodo('TRANSFERENCIA')"
                        class="py-2 text-sm font-bold rounded-md transition-all"
                        [ngClass]="{'bg-white shadow text-indigo-600': metodoSeleccionado === 'TRANSFERENCIA', 'text-gray-500 hover:bg-gray-200': metodoSeleccionado !== 'TRANSFERENCIA'}">
                        🏦 Transf.
                    </button>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {{ metodoSeleccionado === 'EFECTIVO' ? 'Dinero Recibido ($)' : 'Monto a Cargo ($)' }}
                    </label>

                    <input type="number" [(ngModel)]="montoPagado" (ngModelChange)="calcularCambio()"
                        (keyup.enter)="confirmar()" [readonly]="metodoSeleccionado !== 'EFECTIVO'"
                        class="block w-full text-3xl border-gray-300 rounded-lg p-3 text-center font-bold focus:ring-4 focus:ring-indigo-200 transition-shadow"
                        [ngClass]="{'bg-gray-100 text-gray-500': metodoSeleccionado !== 'EFECTIVO'}" placeholder="0.00"
                        autofocus>

                    <div *ngIf="metodoSeleccionado === 'EFECTIVO'" class="mt-4 transition-all duration-300">
                        <div class="p-4 rounded-lg flex justify-between items-center border"
                            [ngClass]="{'bg-green-50 border-green-200': cambio >= 0, 'bg-red-50 border-red-200': cambio < 0}">
                            <span class="font-bold text-gray-700">CAMBIO:</span>
                            <span class="text-2xl font-black"
                                [ngClass]="{'text-green-700': cambio >= 0, 'text-red-700': cambio < 0}">
                                {{ (cambio > 0 ? cambio : 0) | currency:'USD' }}
                            </span>
                        </div>
                        <p *ngIf="cambio < 0" class="text-red-600 text-sm mt-2 font-bold text-center animate-pulse">
                            ⚠️ Faltan {{ (cambio * -1) | currency:'USD' }} para completar
                        </p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse gap-3">
                <button (click)="confirmar()"
                    [disabled]="!montoPagado || (metodoSeleccionado === 'EFECTIVO' && cambio < 0) || isProcessing"
                    class="w-full inline-flex justify-center items-center rounded-xl shadow-lg px-6 py-3 bg-green-600 text-base font-bold text-white hover:bg-green-700 active:scale-95 transition-all sm:w-auto disabled:bg-gray-300 disabled:cursor-not-allowed disabled:shadow-none">

                    <span *ngIf="isProcessing" class="animate-spin mr-2">⏳</span>
                    {{ isProcessing ? 'Procesando...' : 'CONFIRMAR PAGO' }}
                </button>

                <button (click)="onClose.emit()"
                    class="mt-3 w-full inline-flex justify-center rounded-xl border border-gray-300 shadow-sm px-4 py-3 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>
