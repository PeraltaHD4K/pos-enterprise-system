<div class="flex-1 bg-gray-50 flex flex-col border-r border-gray-200 overflow-hidden relative h-full">
    <div class="p-4 bg-white shadow-sm z-10">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input #searchInput type="text" [ngModel]="searchTerm" (ngModelChange)="onSearchChange($event)"
                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 sm:text-lg transition duration-150 ease-in-out"
                placeholder="Escanea código o busca producto..." autofocus>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">

            <div *ngFor="let p of products" (click)="onProductSelect.emit(p)"
                class="rounded-lg shadow-sm cursor-pointer border transition-all transform hover:-translate-y-1 active:scale-95 flex flex-col overflow-hidden h-32 group relative"
                [ngClass]="{
                    'bg-white border-gray-200 hover:shadow-md': p.stockActual > 0,
                    'bg-gray-100 border-gray-200': p.stockActual <= 0
                }">

                <div class="h-1 w-full transition-all duration-300" [ngClass]="{
                        'bg-indigo-500 group-hover:h-2': p.stockActual >= 10,
                        'bg-orange-500 group-hover:h-2': p.stockActual > 0 && p.stockActual < 10,
                        'bg-red-500': p.stockActual <= 0
                    }">
                </div>

                <div class="p-3 flex-1 flex flex-col justify-between">
                    <h3 class="text-sm font-semibold leading-tight line-clamp-2"
                        [ngClass]="{'text-gray-800 group-hover:text-indigo-600': p.stockActual > 0, 'text-gray-500 opacity-70': p.stockActual <= 0}">
                        {{ p.nombre }}
                    </h3>

                    <div class="flex justify-between items-end mt-2">
                        <span *ngIf="p.stockActual <= 0"
                            class="text-[10px] font-black text-red-600 bg-red-100 px-2 py-1 rounded-full border border-red-200 shadow-sm">
                            🚫 AGOTADO
                        </span>

                        <span *ngIf="p.stockActual > 0 && p.stockActual < 10"
                            class="text-[10px] font-bold text-orange-700 bg-orange-100 px-2 py-0.5 rounded-full border border-orange-200 flex items-center gap-1">
                            ⚠️ {{ p.stockActual }}
                        </span>

                        <span *ngIf="p.stockActual >= 10"
                            class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded border border-gray-200">
                            Stock: {{ p.stockActual }}
                        </span>

                        <span class="text-lg font-bold"
                            [ngClass]="{'text-gray-900': p.stockActual > 0, 'text-gray-400': p.stockActual <= 0}">
                            {{ p.precioVenta | currency:'USD' }}
                        </span>
                    </div>
                </div>

                <div *ngIf="p.stockActual <= 0" class="absolute inset-0 bg-white bg-opacity-10 pointer-events-none">
                </div>
            </div>
        </div>

        <div *ngIf="products.length === 0"
            class="flex flex-col items-center justify-center h-64 text-gray-400 animate-fade-in">
            <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <p class="text-lg font-medium">No se encontraron productos</p>
            <p class="text-sm">Intenta con otro término o código</p>
        </div>
    </div>
</div>
