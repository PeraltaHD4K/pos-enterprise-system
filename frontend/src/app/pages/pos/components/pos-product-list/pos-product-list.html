<div class="flex-1 bg-gray-50 flex flex-col border-r border-gray-200 overflow-hidden relative h-full">
    <div class="p-4 bg-white shadow-sm z-10">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input #searchInput type="text" [ngModel]="searchTerm" (ngModelChange)="onSearchChange($event)"
                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 sm:text-lg transition duration-150 ease-in-out"
                placeholder="Escanea código o busca producto..." autofocus>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div *ngFor="let p of products" (click)="onProductSelect.emit(p)"
                class="bg-white rounded-lg shadow-sm hover:shadow-md cursor-pointer border border-gray-200 transition-transform transform hover:-translate-y-1 active:scale-95 flex flex-col overflow-hidden h-32 group">
                <div class="p-3 flex-1 flex flex-col justify-between">
                    <h3
                        class="text-sm font-semibold text-gray-800 leading-tight group-hover:text-indigo-600 line-clamp-2">
                        {{ p.nombre }}</h3>
                    <div class="flex justify-between items-end mt-2">
                        <span class="text-xs text-gray-500 bg-gray-100 px-1 rounded">Stock: {{ p.stockActual }}</span>
                        <span class="text-lg font-bold text-gray-900">{{ p.precioVenta | currency:'USD' }}</span>
                    </div>
                </div>
                <div class="h-1 bg-indigo-500 w-0 group-hover:w-full transition-all duration-300"></div>
            </div>
        </div>

        <div *ngIf="products.length === 0" class="flex flex-col items-center justify-center h-64 text-gray-400">
            <p>No se encontraron productos</p>
        </div>
    </div>
</div>
