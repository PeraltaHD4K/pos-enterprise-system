<div class="relative w-full max-w-md">

    <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="text-gray-400">👤</span>
        </div>

        <input [formControl]="searchControl" type="text" [class.bg-green-50]="selectedClient()"
            [class.border-green-500]="selectedClient()" [class.text-green-700]="selectedClient()"
            class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 sm:text-sm transition duration-150 ease-in-out"
            placeholder="Buscar Cliente (Nombre/Tel)..." (focus)="showDropdown.set(true)"
            (blur)="isLoading() ? null : null"> <button *ngIf="searchControl.value" (click)="clear()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer">
            ✖
        </button>
    </div>

    <div *ngIf="showDropdown() && (results().length > 0 || isLoading())"
        class="absolute z-50 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none sm:text-sm">

        <div *ngIf="isLoading()" class="px-4 py-2 text-gray-500 text-center">
            Buscando...
        </div>

        <ul *ngIf="!isLoading()">
            <li *ngFor="let client of results()" (click)="select(client)"
                class="cursor-pointer select-none relative py-2 pl-3 pr-9 hover:bg-indigo-50 text-gray-900">

                <div class="flex flex-col">
                    <span class="font-medium block truncate">{{ client.nombre }}</span>
                    <span class="text-gray-500 text-xs" *ngIf="client.telefono || client.email">
                        {{ client.telefono }} {{ client.email ? ' - ' + client.email : '' }}
                    </span>
                </div>
            </li>
        </ul>
    </div>
</div>
