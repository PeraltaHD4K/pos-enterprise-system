<div *ngIf="isOpen" class="fixed inset-0 z-[70] overflow-y-auto">
    <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75" (click)="onClose.emit()"></div>

        <div
            class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-sm w-full">
            <div class="bg-gray-100 px-4 py-3 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-900">🧾 Recibo de Venta</h3>
                <button (click)="onClose.emit()" class="text-gray-500 hover:text-gray-700">✖</button>
            </div>

            <div class="bg-white p-4 flex justify-center">
                <pre
                    class="font-mono text-xs text-gray-800 whitespace-pre-wrap bg-gray-50 p-4 border border-gray-200 shadow-sm w-full text-center">{{ content }}</pre>
            </div>

            <div class="bg-gray-50 px-4 py-3 sm:px-6 flex flex-row gap-2">
                <button (click)="imprimir()"
                    class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700">🖨️
                    Imprimir</button>
                <button (click)="onClose.emit()"
                    class="w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50">Cerrar</button>
            </div>
        </div>
    </div>
</div>
