<div class="w-96 bg-white shadow-xl flex flex-col z-20 h-full border-l border-gray-200">
    <div class="bg-indigo-900 text-white p-4 shadow-md">
        <h2 class="text-lg font-bold flex items-center gap-2"><span>🛒</span> Ticket de Venta</h2>
        <p class="text-indigo-200 text-xs mt-1">{{ cart.length }} Artículos agregados</p>
    </div>

    <div class="flex-1 overflow-y-auto p-2 space-y-2 bg-gray-50">
        <div *ngFor="let item of cart; let i = index"
            class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center group">
            <div class="flex-1">
                <div class="text-sm font-medium text-gray-900">{{ item.producto.nombre }}</div>
                <div class="text-xs text-gray-500">{{ item.producto.precioVenta | currency:'USD' }} x {{ item.cantidad
                    }}</div>
            </div>
            <div class="flex items-center gap-2">
                <div class="text-sm font-bold text-gray-900 w-16 text-right">{{ item.subtotal | currency:'USD' }}</div>

                <div class="flex items-center bg-gray-100 rounded-lg overflow-hidden border border-gray-200">
                    <button (click)="onUpdateQuantity.emit({index: i, delta: -1})"
                        class="px-2 py-1 hover:bg-red-100 text-red-600 font-bold w-8">-</button>

                    <div (click)="onEditQuantity.emit(item)"
                        class="px-2 py-1 font-bold text-gray-800 bg-white border-x border-gray-200 cursor-pointer hover:bg-yellow-50 min-w-[30px] text-center text-sm"
                        title="Clic para editar">
                        {{ item.cantidad }}
                    </div>

                    <button (click)="onUpdateQuantity.emit({index: i, delta: 1})"
                        class="px-2 py-1 hover:bg-green-100 text-green-600 font-bold w-8">+</button>
                </div>

                <button (click)="onRemoveItem.emit(i)"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors ml-1"
                    title="Quitar producto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>

        <div *ngIf="cart.length === 0"
            class="h-full flex flex-col items-center justify-center text-gray-400 opacity-50">
            <p class="text-sm">Escanea productos para comenzar</p>
        </div>
    </div>

    <div class="bg-white p-4 border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="flex justify-between items-center mb-4">
            <span class="text-gray-500 font-medium text-lg">TOTAL</span>
            <span class="text-4xl font-black text-indigo-900">{{ total | currency:'USD' }}</span>
        </div>

        <button (click)="onCheckout.emit()" [disabled]="cart.length === 0"
            class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-xl shadow-lg hover:bg-green-700 active:transform active:scale-95 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all flex justify-center items-center gap-2">
            <span>PAGAR</span> <span class="text-2xl">➔</span>
            <span class="text-[10px] opacity-80 font-normal tracking-wider mt-0.5">[ F12 ]</span>
        </button>
    </div>
</div>
