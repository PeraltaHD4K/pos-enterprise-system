<div class="min-h-screen bg-gray-50 p-6">
    <div class="max-w-6xl mx-auto space-y-6">

        <div
            class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Clientes</h1>
                <p class="text-xs text-gray-500">Gestión de cartera</p>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    <input [formControl]="searchControl" type="text" placeholder="Buscar por nombre..."
                        class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <button routerLink="/customers/create"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors flex items-center gap-2">
                    <span>+</span> Nuevo
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left text-sm text-gray-600">
                <thead class="bg-gray-50 text-xs uppercase font-bold text-gray-500 border-b border-gray-100">
                    <tr>
                        <th class="px-6 py-4">Nombre</th>
                        <th class="px-6 py-4">Contacto</th>
                        <th class="px-6 py-4 text-center">Fidelidad</th>
                        <th class="px-6 py-4 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">

                    <tr *ngIf="isLoading()">
                        <td colspan="4" class="px-6 py-8 text-center">
                            <div class="inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600">
                            </div>
                        </td>
                    </tr>

                    <tr *ngFor="let client of clients()" class="hover:bg-gray-50 transition-colors group">
                        <td class="px-6 py-4">
                            <p class="font-bold text-gray-900">{{ client.nombre }}</p>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col">
                                <span class="text-gray-900" *ngIf="client.telefono">📞 {{ client.telefono }}</span>
                                <span class="text-gray-500 text-xs" *ngIf="client.email">✉️ {{ client.email }}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded-full">
                                {{ client.puntosFidelidad || 0 }} pts
                            </span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button [routerLink]="['/customers/edit', client.id]"
                                class="text-indigo-600 font-bold hover:text-indigo-800">
                                Editar
                            </button>
                        </td>
                    </tr>

                    <tr *ngIf="!isLoading() && clients().length === 0">
                        <td colspan="4" class="px-6 py-8 text-center text-gray-400 italic">
                            No se encontraron clientes.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
