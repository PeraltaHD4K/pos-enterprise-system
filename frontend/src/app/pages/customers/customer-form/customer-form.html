<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
            {{ isEditMode() ? 'Editar Cliente' : 'Nuevo Cliente' }}
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            {{ isEditMode() ? 'Actualiza la información de contacto' : 'Registra un nuevo cliente para fidelización' }}
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100">

            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700">
                        Nombre Completo *
                    </label>
                    <div class="mt-1">
                        <input id="nombre" type="text" formControlName="nombre" placeholder="Ej. Juan Pérez"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                            [class.border-red-500]="form.get('nombre')?.invalid && form.get('nombre')?.touched">
                    </div>
                    <p *ngIf="form.get('nombre')?.hasError('required') && form.get('nombre')?.touched"
                        class="mt-1 text-xs text-red-600">
                        El nombre es obligatorio.
                    </p>
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700">
                        Teléfono
                    </label>
                    <div class="mt-1">
                        <input id="telefono" type="tel" formControlName="telefono" placeholder="Ej. 5512345678"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <p *ngIf="form.get('telefono')?.hasError('pattern')" class="mt-1 text-xs text-red-600">
                        Solo se permiten números.
                    </p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">
                        Correo Electrónico
                    </label>
                    <div class="mt-1">
                        <input id="email" type="email" formControlName="email" placeholder="juan@ejemplo.com"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    <p *ngIf="form.get('email')?.hasError('email')" class="mt-1 text-xs text-red-600">
                        Ingresa un correo válido.
                    </p>
                </div>

                <div class="flex items-center gap-4 pt-4">
                    <button type="button" routerLink="/customers"
                        class="w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Cancelar
                    </button>

                    <button type="submit" [disabled]="form.invalid || isLoading()"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">

                        <span *ngIf="isLoading()" class="mr-2">
                            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </span>
                        {{ isLoading() ? 'Guardando...' : 'Guardar Cliente' }}
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
